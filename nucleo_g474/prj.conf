CONFIG_MAIN_STACK_SIZE=8192

# Console over ST-LINK VCP (LPUART1 on PA2/PA3)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Enable LOG so spi_cmd.c LOG_INF messages are visible on the VCP.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# spi_cmd.c logs %f values (freq/mag); cbprintf float formatting is off by
# default unless the FPU is enabled, so enable it explicitly.
CONFIG_CBPRINTF_FP_SUPPORT=y

# GPIO + pinctrl needed to mux the TIM1 PWM output pins.
# CONFIG_PWM enables the st,stm32-pwm driver for the pwm1 node in
# app.overlay; WITHOUT it the pwm1 pinctrl-0 (PA8..PA12/PB15 -> TIM1 AF)
# is never applied and no PWM reaches the pins even though TIM1 runs.
CONFIG_GPIO=y
CONFIG_PWM=y

# SPI1 master command link from the H7S78-DK slave (frequency/magnitude control)
CONFIG_SPI=y
