CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=8192

# SPI slave link to the G474RE SVPWM master
CONFIG_SPI=y
# Software slave-select (SSM=1): SPI4 slave always selected; the
# master (G474) owns physical CS. No NSS AF pin needed on PE4.
CONFIG_SPI_STM32_USE_HW_SS=n

CONFIG_DISPLAY=y

# display config (DK native LTDC panel, chosen via board dts)
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
# larger font for the footer info readout
CONFIG_LV_FONT_MONTSERRAT_20=y

# input config (DK native GT911 touch, chosen via board dts;
# INPUT_GT911 + interrupt mode default on when INPUT is enabled)
CONFIG_INPUT=y
CONFIG_LV_Z_POINTER_INPUT=y

CONFIG_SHELL=y
CONFIG_PRINTK=y

# picolibc: enable %f in printf/snprintf (gauge/card/slider value text)
CONFIG_PICOLIBC_IO_FLOAT=y

CONFIG_SERIAL=y
